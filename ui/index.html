<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Feather Core Clipboard Relay</title>
  </head>
  <body>
    <!--
      This page has no visible UI. Its only job is relaying clipboard writes
      requested by ClipAPI.CopyToClipboard (client/services/clip.lua) --
      clipboard access belongs to the embedded browser and isn't exposed as
      a RedM game native. The player-facing HUD moved to the feather-hud
      resource; this stays in feather-core so `Feather.Clip.CopyToClipboard`
      keeps working for every resource that depends on feather-core alone
      (e.g. feather-admin) without pulling in a feather-hud dependency.
    -->
    <script>
      const copyToClipboard = async (text) => {
        const value = String(text ?? "");
        if (!value) return;

        try {
          await navigator.clipboard.writeText(value);
          return;
        } catch (_) {
          // RedM may deny the modern clipboard API while the NUI is hidden.
        }

        const textarea = document.createElement("textarea");
        textarea.value = value;
        textarea.setAttribute("readonly", "");
        textarea.style.position = "fixed";
        textarea.style.opacity = "0";
        document.body.appendChild(textarea);
        textarea.select();
        document.execCommand("copy");
        textarea.remove();
      };

      window.addEventListener("message", (event) => {
        if (event.data.type !== "clipboard") return;
        copyToClipboard(event.data.text);
      });
    </script>
  </body>
</html>
